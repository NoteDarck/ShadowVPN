name: Release multiplataforma

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: v0.2.1)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Empacotar ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-x86_64
            os: windows-2025
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validar tag manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "A tag ${TAG} não existe no remoto. Crie e envie a tag antes do workflow manual." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            pkg-config

      - name: Compilar
        run: cargo build --release --workspace --locked

      - name: Empacotar (Linux e macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          dir="ShadowVPN-${TAG}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp target/release/shadowvpn-client \
             target/release/shadowvpn-server \
             target/release/shadowvpn-gui \
             README.md \
             "$dir/"
          cp -R assets "$dir/"
          chmod +x "$dir"/shadowvpn-*
          archive="${dir}.tar.gz"
          tar -czf "$archive" "$dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "ShadowVPN-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item target/release/shadowvpn-client.exe $dir
          Copy-Item target/release/shadowvpn-server.exe $dir
          Copy-Item target/release/shadowvpn-gui.exe $dir
          Copy-Item README.md $dir
          Copy-Item assets $dir -Recurse

          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest `
            -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' `
            -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum do wintun.zip inválido: $actual"
          }

          $extract = Join-Path $env:RUNNER_TEMP 'wintun-extract'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $wintun = Join-Path $extract 'wintun'
          Copy-Item (Join-Path $wintun 'bin/amd64/wintun.dll') $dir
          Copy-Item (Join-Path $wintun 'LICENSE.txt') (Join-Path $dir 'wintun-LICENSE.txt')

          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$dir.zip").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path "$dir.zip.sha256"),
            "$hash  $dir.zip`n"
          )

      - name: Publicar artefato do job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ShadowVPN-*.tar.gz
            ShadowVPN-*.tar.gz.sha256
            ShadowVPN-*.zip
            ShadowVPN-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publicar no GitHub Releases
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: Validar e consolidar checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -lh
          sed -i 's/\r$//' ./*.sha256
          for file in *.sha256; do
            sha256sum --check "$file"
          done
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.tar.gz.sha256 ./*.zip.sha256

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ShadowVPN ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
