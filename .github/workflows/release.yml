name: Release multiplataforma

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: v0.2.1)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Empacotar ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            appimage_arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            appimage_arch: aarch64
          - name: windows-x86_64
            os: windows-2025
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validar tag manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "A tag ${TAG} não existe no remoto. Crie e envie a tag antes do workflow manual." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            pkg-config

      - name: Compilar
        run: cargo build --release --workspace --locked

      - name: Empacotar (Linux e macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          dir="ShadowVPN-${TAG}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp target/release/shadowvpn-client \
             target/release/shadowvpn-server \
             target/release/shadowvpn-gui \
             README.md \
             "$dir/"
          cp -R assets "$dir/"
          chmod +x "$dir"/shadowvpn-*
          archive="${dir}.tar.gz"
          tar -czf "$archive" "$dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Empacotar AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          case "$APPIMAGE_ARCH" in
            x86_64)
              linuxdeploy_sha='c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
              appimagetool_sha='ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
              ;;
            aarch64)
              linuxdeploy_sha='620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff'
              appimagetool_sha='f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158'
              ;;
            *)
              echo "Arquitetura AppImage não suportada: $APPIMAGE_ARCH" >&2
              exit 1
              ;;
          esac

          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${APPIMAGE_ARCH}.AppImage"
          curl -fsSL -o "$tools/appimagetool.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage"
          echo "${linuxdeploy_sha}  $tools/linuxdeploy.AppImage" | sha256sum -c -
          echo "${appimagetool_sha}  $tools/appimagetool.AppImage" | sha256sum -c -
          chmod +x "$tools/linuxdeploy.AppImage" "$tools/appimagetool.AppImage"

          dir="ShadowVPN-${TAG}-${{ matrix.name }}"
          appdir="$RUNNER_TEMP/ShadowVPN.AppDir"
          rm -rf "$appdir"
          mkdir -p \
            "$appdir/usr/bin" \
            "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp target/release/shadowvpn-gui \
             target/release/shadowvpn-client \
             target/release/shadowvpn-server \
             "$appdir/usr/bin/"
          cp assets/icon.png "$appdir/shadowvpn.png"
          cp assets/icon.png "$appdir/usr/share/icons/hicolor/512x512/apps/shadowvpn.png"
          cp packaging/linux/shadowvpn.desktop "$appdir/shadowvpn.desktop"
          cp packaging/linux/shadowvpn.desktop "$appdir/usr/share/applications/shadowvpn.desktop"

          export ARCH="$APPIMAGE_ARCH"
          APPIMAGE_EXTRACT_AND_RUN=1 "$tools/linuxdeploy.AppImage" \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/shadowvpn-gui" \
            --desktop-file "$appdir/usr/share/applications/shadowvpn.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/512x512/apps/shadowvpn.png"
          APPIMAGE_EXTRACT_AND_RUN=1 "$tools/appimagetool.AppImage" \
            "$appdir" "${dir}.AppImage"
          sha256sum "${dir}.AppImage" > "${dir}.AppImage.sha256"
          file "${dir}.AppImage"

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "ShadowVPN-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item target/release/shadowvpn-client.exe $dir
          Copy-Item target/release/shadowvpn-server.exe $dir
          Copy-Item target/release/shadowvpn-gui.exe $dir
          Copy-Item README.md $dir
          Copy-Item assets $dir -Recurse

          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest `
            -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' `
            -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum do wintun.zip inválido: $actual"
          }

          $extract = Join-Path $env:RUNNER_TEMP 'wintun-extract'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $wintun = Join-Path $extract 'wintun'
          Copy-Item (Join-Path $wintun 'bin/amd64/wintun.dll') $dir
          Copy-Item (Join-Path $wintun 'LICENSE.txt') (Join-Path $dir 'wintun-LICENSE.txt')

          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$dir.zip").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path "$dir.zip.sha256"),
            "$hash  $dir.zip`n"
          )

          $version = $env:TAG.TrimStart('v')
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup não encontrado em $iscc"
          }
          $stageDir = (Resolve-Path $dir).Path
          $outputDir = (Get-Location).Path
          & $iscc `
            "/DMyAppVersion=$version" `
            "/DMyAppTag=$env:TAG" `
            "/DStageDir=$stageDir" `
            "/O$outputDir" `
            "packaging\windows\shadowvpn.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar o instalador Windows"
          }

          $setup = "ShadowVPN-$env:TAG-windows-x86_64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Instalador não gerado: $setup"
          }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path "$setup.sha256"),
            "$setupHash  $setup`n"
          )

      - name: Publicar artefato do job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ShadowVPN-*.tar.gz
            ShadowVPN-*.tar.gz.sha256
            ShadowVPN-*.zip
            ShadowVPN-*.zip.sha256
            ShadowVPN-*.AppImage
            ShadowVPN-*.AppImage.sha256
            ShadowVPN-*-setup.exe
            ShadowVPN-*-setup.exe.sha256
          if-no-files-found: error

  publish:
    name: Publicar no GitHub Releases
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: Validar e consolidar checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -lh
          sed -i 's/\r$//' ./*.sha256
          for file in *.sha256; do
            sha256sum --check "$file"
          done
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.tar.gz.sha256 ./*.zip.sha256 ./*.AppImage.sha256 ./*-setup.exe.sha256

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ShadowVPN ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
