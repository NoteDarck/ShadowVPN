[package]
name = "shadowvpn-server"
version = "0.1.0"
edition = "2021"

[dependencies]
shadowvpn-core = { path = "../shadowvpn-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"